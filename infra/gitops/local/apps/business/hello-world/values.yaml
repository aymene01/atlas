ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: "app.localhost"
      paths:
        - path: /
          pathType: Prefix
  tls: []

controller:
  service:
    type: ClusterIP 
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
